[project]
name = "irm-stock"
version = "0.1.0"
description = "ERM vs IRM vs IRM-Games on stock-market, ColoredMNIST, and synthetic environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
mnist = ["torchvision>=0.17"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
irm-stock = "irm_stock.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irm_stock"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = [
    "N803", "N806",  # math-style uppercase matrix names (X, W, V) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
# The legacy code consumes NumPy's global RNG, so the comparison must seed it.
"tests/test_regression_legacy.py" = ["NPY002"]
